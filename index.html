<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스트레칭">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
[hidden] { display: none !important; }
</style>
<title>스트레칭 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-thumb phone column — dial on top, rep dots, settings, big controls at the bottom */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --fg: #13211d;
  --muted: #5d6f69;
  --line: #d3dfdb;
  --work: #0b7a68;
  --rest: #c0701a;
  --prep: #4a6fa5;
  --on-accent: #ffffff;
  --font-num: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-text: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1614; --surface: #17221f; --fg: #e4eeea; --muted: #93a8a1; --line: #2a3a35;
    --work: #3cc7ae; --rest: #f0a54a; --prep: #86a8de; --on-accent: #0b1411; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1614; --surface: #17221f; --fg: #e4eeea; --muted: #93a8a1; --line: #2a3a35;
  --work: #3cc7ae; --rest: #f0a54a; --prep: #86a8de; --on-accent: #0b1411; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-text);
  -webkit-tap-highlight-color: transparent;
}
.app {
  box-sizing: border-box; max-width: 440px; min-height: 100%; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 24px;
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 700; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: .875rem; }

.dial { --c: var(--muted); position: relative; width: min(78vw, 300px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.dial[data-phase="work"] { --c: var(--work); }
.dial[data-phase="rest"] { --c: var(--rest); }
.dial[data-phase="prep"] { --c: var(--prep); }
.dial[data-phase="done"] { --c: var(--work); }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.track { fill: none; stroke: var(--line); stroke-width: 10; }
.prog { fill: none; stroke: var(--c); stroke-width: 10; stroke-linecap: round; transition: stroke .2s; }
.ticks line { stroke: var(--muted); stroke-width: 2; opacity: .45; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.phase { font-size: 1rem; font-weight: 700; color: var(--c); letter-spacing: .04em; }
.num { font-family: var(--font-num); font-weight: 700; font-size: clamp(4.5rem, 24vw, 6.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.num.word { font-family: var(--font-text); font-size: clamp(2.8rem, 15vw, 4rem); }
.rep { font-family: var(--font-num); color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }

.dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; min-height: 12px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
.dot.done { background: var(--work); border-color: var(--work); }
.dot.now { border-color: var(--work); }

fieldset { border: 0; margin: 0; padding: 16px; background: var(--surface); border-radius: 14px; display: flex; flex-direction: column; gap: 14px; }
fieldset:disabled { opacity: .5; }
.label { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.chip {
  font: 700 1.05rem var(--font-num); padding: 10px 0; border-radius: 10px;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { background: var(--work); border-color: var(--work); color: var(--on-accent); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: .95rem; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--work); }
.total { margin: 0; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

.controls { margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn { font: 700 1.1rem var(--font-text); padding: 18px 0; border-radius: 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--work); border-color: var(--work); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--prep); outline-offset: 2px; }
.note { margin: 0; color: var(--muted); font-size: .8rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { .prog { transition: none; } }
</style>

<main class="app">
  <header>
    <h1>스트레칭 타이머</h1>
    <p class="sub">10초 스트레칭 · 2초 휴식</p>
  </header>

  <section class="dial" id="dial" data-phase="idle" aria-live="polite">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="88"></circle>
      <g class="ticks" id="ticks"></g>
      <circle class="prog" id="prog" cx="100" cy="100" r="88"></circle>
    </svg>
    <div class="center">
      <div class="phase" id="phase">대기</div>
      <div class="num" id="num">10</div>
      <div class="rep" id="rep">0 / 6회</div>
    </div>
  </section>

  <div class="dots" id="dots"></div>

  <fieldset id="settings">
    <div class="label">반복 횟수</div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="prep" checked> 시작 전 3초 준비</label>
      <p class="total" id="total"></p>
    </div>
  </fieldset>

  <div class="controls">
    <button class="btn" id="reset" type="button">처음으로</button>
    <button class="btn primary" id="start" type="button">시작</button>
  </div>
  <p class="note">매초 삐 소리, 10초마다 "하나, 둘…" 음성. 아이폰은 무음 모드를 꺼야 소리가 납니다.</p>
</main>

<script>
(() => {
  const WORK = 10, REST = 2, PREP = 3;
  const WORDS = ['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열','열하나','열둘'];
  const C = 2 * Math.PI * 88;
  const $ = id => document.getElementById(id);
  const dial = $('dial'), prog = $('prog'), numEl = $('num'), phaseEl = $('phase'), repEl = $('rep');
  const startBtn = $('start'), resetBtn = $('reset'), settings = $('settings'), prepBox = $('prep');

  prog.style.strokeDasharray = C;
  prog.style.strokeDashoffset = C;
  // 10 tick marks around the dial = 10 seconds
  const ticks = $('ticks');
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * 2 * Math.PI, r1 = 76, r2 = 70;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 100 + r1 * Math.cos(a)); l.setAttribute('y1', 100 + r1 * Math.sin(a));
    l.setAttribute('x2', 100 + r2 * Math.cos(a)); l.setAttribute('y2', 100 + r2 * Math.sin(a));
    ticks.appendChild(l);
  }

  let reps = 6;
  try { const s = parseInt(localStorage.getItem('stretch-reps'), 10); if (s >= 2 && s <= 12) reps = s; } catch (e) {}
  try { const p = localStorage.getItem('stretch-prep'); if (p !== null) prepBox.checked = p === '1'; } catch (e) {}

  const chips = $('chips');
  for (let n = 2; n <= 12; n++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = n; b.id = 'rep-' + n;
    b.addEventListener('click', () => { reps = n; save(); idleView(); });
    chips.appendChild(b);
  }
  function save() {
    try { localStorage.setItem('stretch-reps', reps); localStorage.setItem('stretch-prep', prepBox.checked ? '1' : '0'); } catch (e) {}
  }
  prepBox.addEventListener('change', () => { save(); idleView(); });

  // ---------- sound ----------
  let ac = null;
  function tone(freq, dur, vol = 0.4, delay = 0) {
    if (!ac) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    tick:  () => tone(880, 0.09),
    start: () => tone(1320, 0.35, 0.5),
    rest:  () => tone(440, 0.14),
    prep:  () => tone(660, 0.12),
    done:  () => { tone(988, 0.2, 0.45, 0); tone(1319, 0.2, 0.45, 0.22); tone(1760, 0.5, 0.45, 0.44); }
  };

  let koVoice = null;
  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const v = speechSynthesis.getVoices();
    koVoice = v.find(x => x.lang && x.lang.toLowerCase().replace('_', '-').startsWith('ko')) || null;
  }
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function say(text) {
    if (!('speechSynthesis' in window)) { tone(1046, 0.15, 0.5); tone(1046, 0.15, 0.5, 0.2); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  }

  // ---------- timeline ----------
  let marks = [], next = 0, P = 0, END = 0;
  let running = false, finished = false, started = false, acc = 0, t0 = 0, timer = null, wake = null;

  function build() {
    P = prepBox.checked ? PREP : 0;
    marks = [];
    if (P) {
      marks.push({ t: 0, fn: () => say('준비') });
      for (let k = 1; k < P; k++) marks.push({ t: k, fn: sfx.prep });
    }
    for (let i = 0; i < reps; i++) {
      const s = P + i * (WORK + REST);
      marks.push({ t: s, fn: sfx.start, must: true });
      for (let k = 1; k < WORK; k++) marks.push({ t: s + k, fn: sfx.tick });
      marks.push({ t: s + WORK, fn: () => say(WORDS[i]), must: true });
      if (i < reps - 1) for (let k = 1; k < REST; k++) marks.push({ t: s + WORK + k, fn: sfx.rest });
    }
    END = P + reps * WORK + (reps - 1) * REST;
    next = 0;
  }
  const elapsed = () => acc + (running ? (performance.now() - t0) / 1000 : 0);

  function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m ? `${m}분 ${s}초` : `${s}초`; }

  function view(phase, num, p, done, isWord) {
    dial.dataset.phase = phase;
    phaseEl.textContent = { idle: '대기', prep: '준비', work: '스트레칭', rest: '휴식', done: '완료' }[phase];
    numEl.textContent = num; numEl.classList.toggle('word', !!isWord);
    prog.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, p)));
    repEl.textContent = `${done} / ${reps}회`;
    const dots = $('dots');
    if (dots.children.length !== reps) {
      dots.innerHTML = '';
      for (let i = 0; i < reps; i++) { const d = document.createElement('span'); d.className = 'dot'; dots.appendChild(d); }
    }
    [...dots.children].forEach((d, i) => {
      d.classList.toggle('done', i < done);
      d.classList.toggle('now', i === done && (phase === 'work'));
    });
  }

  function render(e) {
    if (e < P) return view('prep', Math.ceil(P - e), e / P, 0);
    const x = e - P, cyc = WORK + REST, i = Math.floor(x / cyc), w = x - i * cyc;
    if (e >= END) return view('done', WORDS[reps - 1], 1, reps, true);
    if (w < WORK) return view('work', Math.ceil(WORK - w), w / WORK, i);
    return view('rest', WORDS[i], (w - WORK) / REST, i + 1, true);
  }

  function idleView() {
    if (started) return;
    [...chips.children].forEach(b => b.setAttribute('aria-pressed', String(+b.textContent === reps)));
    const P0 = prepBox.checked ? PREP : 0;
    $('total').textContent = '총 ' + fmt(P0 + reps * WORK + (reps - 1) * REST);
    view('idle', WORK, 0, 0);
  }

  function loop() {
    const e = elapsed();
    while (next < marks.length && marks[next].t <= e + 0.015) {
      const m = marks[next++];
      if (m.must || e - m.t < 0.6) m.fn();
    }
    if (e >= END) { finish(); return; }
    render(e);
  }

  async function lockScreen() {
    try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) lockScreen(); });

  function play() {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume();
    if (!started) {
      build(); acc = 0; started = true; finished = false;
      // unlock speech on iOS inside the tap
      if (!P && 'speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
    }
    running = true; t0 = performance.now();
    settings.disabled = true;
    startBtn.textContent = '일시정지';
    lockScreen();
    loop();
    timer = setInterval(loop, 40);
  }
  function pause() {
    acc = elapsed(); running = false; clearInterval(timer);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    startBtn.textContent = '계속';
    unlockScreen();
  }
  function finish() {
    running = false; clearInterval(timer); finished = true;
    render(END);
    setTimeout(sfx.done, 900);
    startBtn.textContent = '다시 시작';
    unlockScreen();
  }
  function reset() {
    running = false; clearInterval(timer); started = false; finished = false; acc = 0;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    settings.disabled = false;
    startBtn.textContent = '시작';
    unlockScreen();
    idleView();
  }

  startBtn.addEventListener('click', () => {
    if (finished) { reset(); play(); return; }
    running ? pause() : play();
  });
  resetBtn.addEventListener('click', reset);

  idleView();
})();
</script>
</html>
